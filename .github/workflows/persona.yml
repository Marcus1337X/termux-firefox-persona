name: Persona checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[persona]'
      - run: python -m compileall -q src cli.py
      - run: python -m unittest discover -s tests/unit -v
      - name: Check Persona CLI
        run: python -m src.persona.cli --help
